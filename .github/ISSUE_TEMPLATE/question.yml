name: Setup question
description: Help getting something working, or a question about how to use this repository.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This repository covers the pylepton Python library for reading a Lepton over SPI. GroupGets provides this code as is and does not offer support, but clear reports help everyone who uses it.

        This repository is for a Lepton read over VoSPI (SPI). For a PureThermal board over USB, use [purethermal1-uvc-capture](https://github.com/groupgets/purethermal1-uvc-capture) or [GetThermal](https://github.com/groupgets/GetThermal).

        Before filing, please check the [README](https://github.com/groupgets/pylepton#readme) and search existing issues, open and closed.
  - type: dropdown
    id: lepton
    attributes:
      label: "Lepton model"
      description: "Printed on the label on the back of the Lepton module."
      options:
        - "Lepton 3.5"
        - "Lepton 3.1R"
        - "Lepton 3.0"
        - "Lepton 2.5"
        - "Lepton 2.0"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: "Your question"
      description: "What you are trying to do and where you got stuck. Include any error output."
    validations:
      required: true
